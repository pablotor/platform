version: '3.9'
name: ptp-local
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: '../apps/api/.env.local'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

